[project]
site_url = "https://pdx122.github.io/Actors/"
site_name = "Flashback Actors"
site_description = "Record virtual actors inside a Flashback replay."
site_author = "PDX122"

copyright = "MIT &mdash; PDX122"

repo_url = "https://github.com/PDX122/Actors"
repo_name = "PDX122/Actors"
edit_uri = "edit/main/docs-site/docs/"

nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Record takes" = "takes.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

logo = "assets/logo.png"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/PDX122/Actors"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
