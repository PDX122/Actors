name: Documentation
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs-site/**
      - tools/qa_site/**
      - tools/export_qa_site.py
      - .github/workflows/docs.yml
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install -r docs-site/requirements.txt
      - run: python docs-site/build.py
      - run: python docs-site/check.py --static-only
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/site
      - uses: actions/deploy-pages@v5
        id: deployment
