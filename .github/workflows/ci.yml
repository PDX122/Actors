# Static checks that run on every push and pull request, plus full cloud
# builds on tags and manual dispatch.
#
# The compile and game-test jars for Flashback are proprietary and cannot live
# in git. Our release jars contain zero Flashback classes, so the cloud build
# job downloads the pinned versions from Modrinth at build time purely as
# compile dependencies (tools/fetch_flashback.py, sha512-checked, never
# shipped). Game-client tests stay manual: headless GPUs are a gamble.

name: Static checks

on:
  push:
  pull_request:
  # Manual full builds (see the build job).
  workflow_dispatch:

jobs:
  static:
    name: Signatures and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Mixin signatures (tables, no Flashback jars)
        run: python3 tools/verify_mixins.py --no-live --no-flashback

      - name: JSON validity
        run: |
          python3 - <<'EOF'
          import json, glob
          files = (
              glob.glob('src/main/resources/*.json')
              + glob.glob('compat/*/resources/*.json')
              + glob.glob('src/main/resources/assets/**/.json', recursive=True)
          )
          assert files, "no JSON files found - glob is wrong"
          for path in sorted(files):
              with open(path, encoding='utf-8') as f:
                  json.load(f)
              print(f"ok: {path}")
          EOF

      - name: Tooling syntax
        run: python3 -m py_compile tools/verify_mixins.py tools/add_headers.py

  # Full build of all nine targets plus unit tests, in the public cloud.
  # Possible because our jars contain zero Flashback classes: the proprietary
  # jars are downloaded from Modrinth at build time purely as compile
  # dependencies (never redistributed) by tools/fetch_flashback.py, which
  # resolves every pinned version with sha512 checks. Game-client tests stay
  # manual: headless GPUs are a gamble this project does not take.
  build:
    name: Build all versions
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Gradle daemon)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up JDK 21 (1.21.x toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle and jars
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            libs
          key: fbactors-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle', 'settings.gradle', 'gradle.properties', 'versions/*/gradle.properties') }}

      # The tracked gradle.properties carries Windows JDK paths. Point the
      # Linux runner at its Temurin installs without touching the file in git.
      - name: Point Gradle at Linux JDKs
        run: |
          chmod +x gradlew
          sed -i "s|^org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME_25_X64|" gradle.properties
          sed -i "s|^org.gradle.java.installations.paths=.*|org.gradle.java.installations.paths=$JAVA_HOME_21_X64|" gradle.properties

      - name: Fetch Flashback jars
        run: python3 tools/fetch_flashback.py

      - name: Build all nine targets
        run: ./gradlew buildAll

      - name: Unit tests, both families
        run: ./gradlew :versions:1.21.11:test :versions:26.3:test

      - name: Publish release jars
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*.jar
          generate_release_notes: true
